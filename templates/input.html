<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>词霸（开发版）：录入单词</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='pages/input/input.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='public/public.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon-32x32.png') }}">
</head>
<body>
    <div class="main">

        <!--左边栏-->
        <div class="left">
            <button class="left-toggle-btn" aria-label="折叠/展开侧边栏" style="position: absolute; right: 15px; top: 15px; width: 30px; height: 30px; background: none; border: none; padding: 0; cursor: pointer; z-index: 10;">
                <img src="/static/images/menu.png" alt="菜单" style="width: 30px; height: 30px; pointer-events: none;" />
            </button>
            <p class="title">录入单词</p>
            <div style="height: 30px;"></div>
            <input type="text" placeholder="请输入你的单词" class="input-word" id="input-box">
            <p class="hint">按下Enter以提交单词</p>
            <p class="hint">或在输入框内Ctrl+V提交剪贴板</p>
            <p class="hint">（Mac端为Command+V）</p>
            <div style="height: 20px;"></div>
            <div class="left-btn-grid">
                <button type="button" class="left-buttons" id="clear" style="background-color: #ef4444;">清空列表</button>
                <button type="button" class="left-buttons" id="save" style="background-color: #10b981;">保存列表</button>
                <button type="button" class="left-buttons" id="passage-input-btn" style="background-color: #3b82f6;">文章录入</button>
                <button type="button" class="left-buttons" style="background-color: cyan; display: none;">开始背诵</button>
            </div>
        </div>

        <!--词表部分-->
        <div class="content">
            <div style="height: 28px;"></div>
            <table border="1" class="word-table" id="word-table">
                <colgroup>
                    <col style="width: 10%;">
                    <col style="width: 13%;">
                    <col style="width: 70%;">
                    <col style="width: 7%;">
                </colgroup>
                <thead>
                    <tr>
                        <th class="head">序号</th>
                        <th class="head">单词</th>
                        <th class="head">释义 - 点击来更改</th>
                        <th class="head">操作</th>
                    </tr>
                </thead>
                <tbody id="word-tbody"></tbody>
            </table>
            <div style="height: 28px;"></div>
            
            <!--通知部分-->
            <div class="notifications-container" id="notifications-container"></div>
        </div>

        <!--遮罩-->
        <div class="sidebar-mask" style="pointer-events: none;"></div>
    </div>

    <script src="{{ url_for('static', filename='xlsx.full.min.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='pages/input/input.js') }}"></script>
</body>
</html>
